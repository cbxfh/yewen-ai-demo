<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="登录业问，使用独立账号的个人知识库与 AI 助手。"
    >
    <meta name="theme-color" content="#1b2720">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>登录｜业问</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/login.css">
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="icon-arrow-left" viewBox="0 0 24 24">
        <path d="M19 12H5M10 7l-5 5 5 5"></path>
      </symbol>
      <symbol id="icon-spark" viewBox="0 0 24 24">
        <path d="m12 3-1.6 5.4L5 10l5.4 1.6L12 17l1.6-5.4L19 10l-5.4-1.6L12 3Z"></path>
        <path d="m5 17 .7 2.3L8 20l-2.3.7L5 23l-.7-2.3L2 20l2.3-.7L5 17Z"></path>
      </symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24">
        <path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"></path>
        <circle cx="12" cy="12" r="2.5"></circle>
      </symbol>
      <symbol id="icon-shield" viewBox="0 0 24 24">
        <path d="M12 3 5 6v5c0 4.5 2.8 8.1 7 10 4.2-1.9 7-5.5 7-10V6l-7-3Z"></path>
        <path d="m9 12 2 2 4-4"></path>
      </symbol>
      <symbol id="icon-lock" viewBox="0 0 24 24">
        <rect x="4" y="10" width="16" height="11" rx="2"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
      </symbol>
      <symbol id="icon-arrow-up-right" viewBox="0 0 24 24">
        <path d="M7 17 17 7M8 7h9v9"></path>
      </symbol>
    </svg>

    <main class="auth-shell">
      <section class="auth-visual" aria-hidden="true">
        <a class="auth-brand" href="/">
          <span class="brand-mark">
            <span></span><span></span><span></span><span></span>
          </span>
          <span class="brand-copy">
            <strong>业问</strong>
            <small>门店老板随身的 AI 参谋</small>
          </span>
        </a>
        <div class="visual-copy">
          <span class="visual-kicker">PRIVATE WORKSPACE</span>
          <h1>每个人的资料，<br><em>只属于自己。</em></h1>
          <p>登录后，个人知识库、对话记录和 AI 使用额度都会绑定到你的独立账号。</p>
        </div>
        <div class="privacy-list">
          <span><i>01</i>知识库按账号隔离</span>
          <span><i>02</i>对话记录独立保存</span>
          <span><i>03</i>API 密钥不进入浏览器</span>
        </div>
        <span class="visual-orbit orbit-one"></span>
        <span class="visual-orbit orbit-two"></span>
      </section>

      <section class="auth-panel" aria-labelledby="auth-title">
        <a class="back-link" href="/">
          <svg class="icon" aria-hidden="true"><use href="#icon-arrow-left"></use></svg>
          返回公开网站
        </a>

        <div class="auth-card">
          <div class="auth-heading">
            <span class="auth-mark">
              <svg class="icon" aria-hidden="true"><use href="#icon-spark"></use></svg>
            </span>
            <span class="auth-kicker">YOUR PRIVATE ACCOUNT</span>
            <h2 id="auth-title">欢迎使用业问</h2>
            <p>门店老板随身的 AI 参谋，登录后继续使用个人知识库和 AI 助手。</p>
          </div>

          <div class="auth-tabs" role="tablist" aria-label="登录或注册">
            <button class="active" type="button" data-auth-mode="login" role="tab" aria-selected="true">
              登录
            </button>
            <button type="button" data-auth-mode="register" role="tab" aria-selected="false">
              注册新账号
            </button>
          </div>

          <form id="auth-form" class="auth-form" novalidate>
            <label>
              <span>用户名</span>
              <input
                id="username"
                name="username"
                type="text"
                minlength="3"
                maxlength="24"
                autocomplete="username"
                placeholder="3–24 个汉字、字母或数字"
                required
              >
            </label>
            <label>
              <span>密码</span>
              <div class="password-field">
                <input
                  id="password"
                  name="password"
                  type="password"
                  minlength="8"
                  maxlength="128"
                  autocomplete="current-password"
                  placeholder="至少 8 个字符"
                  required
                >
                <button class="show-password" id="show-password" type="button" aria-label="显示密码">
                  <svg class="icon" aria-hidden="true"><use href="#icon-eye"></use></svg>
                </button>
              </div>
            </label>
            <label class="confirm-password-field" id="confirm-password-field" hidden>
              <span>确认密码</span>
              <input
                id="confirm-password"
                name="confirmPassword"
                type="password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                placeholder="再次输入密码"
              >
            </label>

            <p class="form-error" id="auth-error" role="alert" hidden></p>
            <p class="form-note" id="auth-note">
              首次使用请先注册。当前版本使用用户名和密码登录，不提供邮箱找回密码。
            </p>
            <button class="auth-submit" id="auth-submit" type="submit">
              登录
              <svg class="icon" aria-hidden="true"><use href="#icon-arrow-up-right"></use></svg>
            </button>
          </form>

          <div class="privacy-note">
            <svg class="icon" aria-hidden="true"><use href="#icon-shield"></use></svg>
            <p>
              你的个人资料与对话记录保存在独立账号空间，其他账号无法通过本站接口读取。
              密码只会以不可逆哈希形式保存。
            </p>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="/login.js" defer></script>
  </body>
</html>
