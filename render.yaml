services:
  - type: web
    name: industry-ai-toolkit
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_MAX_TOKENS
        value: "1200"
      - key: USER_DAILY_REQUEST_LIMIT
        value: "80"
      - key: PUBLIC_DAILY_REQUEST_LIMIT
        value: "300"
      - key: APP_DATA_DIR
        value: /app/.data
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FEEDBACK_EMAIL
        value: liusong208825@outlook.com
      - key: SITE_URL
        value: https://yewen-demo.onrender.com
    disk:
      name: industry-ai-user-data
      mountPath: /app/.data
      sizeGB: 1
